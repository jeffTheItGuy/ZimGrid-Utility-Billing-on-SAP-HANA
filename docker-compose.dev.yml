version: "3.9"

services:
  postgres-dev:
    image: postgis/postgis:16-3.4
    container_name: zimgrid-postgres
    environment:
      POSTGRES_DB: zimgrid_billing
      POSTGRES_USER: zimgrid_admin
      POSTGRES_PASSWORD: zimgrid_dev_pass
      PGADMIN_DEFAULT_EMAIL: admin@zimgrid.com
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - zimgrid-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: zimgrid-backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: postgres-dev
      DB_PORT: 5432
      DB_NAME: zimgrid_billing
      DB_USER: zimgrid_admin
      DB_PASSWORD: zimgrid_dev_pass
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/package.json:/app/package.json:ro
      - /app/node_modules
    ports:
      - "4000:4000"
    networks:
      - zimgrid-net
    depends_on:
      - postgres-dev
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: zimgrid-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api/v1
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./frontend/postcss.config.js:/app/postcss.config.js:ro
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - zimgrid-net
    depends_on:
      - backend
    command: npm run dev -- --host

  redis:
    image: redis:7-alpine
    container_name: zimgrid-redis
    ports:
      - "6379:6379"
    networks:
      - zimgrid-net    

volumes:
  postgres_dev_data:

networks:
  zimgrid-net:
    driver: bridge