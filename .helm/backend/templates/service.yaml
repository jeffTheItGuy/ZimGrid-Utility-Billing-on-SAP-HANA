apiVersion: v1
kind: Service
metadata:
  name: zesa-billing-backend-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: zesa-billing-backend
    chart: "zesa-billing-backend-1.0.0"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: zesa-billing-backend
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: http
