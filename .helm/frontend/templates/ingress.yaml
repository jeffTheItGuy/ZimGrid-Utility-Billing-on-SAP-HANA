apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zesa-billing-frontend-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app: zesa-billing-frontend
    chart: "zesa-billing-frontend-1.0.0"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Values.namespace }}-zesa-billing-frontend-security-headers@kubernetescrd"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: zesa-billing-frontend-svc
                port:
                  number: {{ .Values.service.port }}
