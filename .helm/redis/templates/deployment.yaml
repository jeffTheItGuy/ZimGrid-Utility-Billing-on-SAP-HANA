apiVersion: apps/v1
kind: Deployment
metadata:
  name: zesa-billing-redis
  namespace: {{ .Values.namespace }}
  labels:
    app: zesa-billing-redis
    chart: "zesa-billing-redis-1.0.0"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: zesa-billing-redis
  template:
    metadata:
      labels:
        app: zesa-billing-redis
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ .Values.service.port }}
              name: redis
          env:
            {{- if .Values.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: REDIS_PASSWORD
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          command:
            - /bin/sh
            - -c
          {{- if .Values.auth.enabled }}
            - |
              exec redis-server /usr/local/etc/redis/redis.conf \
                --requirepass "$REDIS_PASSWORD" \
                --bind 0.0.0.0
          {{- else }}
            - |
              exec redis-server /usr/local/etc/redis/redis.conf \
                --bind 0.0.0.0
          {{- end }}
          volumeMounts:
            - name: redis-storage
              mountPath: /data
            - name: redis-config
              mountPath: /usr/local/etc/redis
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  {{- if .Values.auth.enabled }}
                  REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep PONG
                  {{- else }}
                  redis-cli ping | grep PONG
                  {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  {{- if .Values.auth.enabled }}
                  REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep PONG
                  {{- else }}
                  redis-cli ping | grep PONG
                  {{- end }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: zesa-billing-redis-pvc
        - name: redis-config
          configMap:
            name: zesa-billing-redis-config
        - name: tmp
          emptyDir: {}
