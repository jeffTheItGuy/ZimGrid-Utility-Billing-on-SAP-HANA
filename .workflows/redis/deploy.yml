name: Redis Deploy

on:
  workflow_dispatch:

env:
  NAMESPACE: zesademo
  RELEASE_NAME: redis-release
  DEPLOYMENT_NAME: zesa-billing-redis

jobs:
  deploy:
    runs-on: self-hosted
    name: Deploy Redis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deployment Configuration
        run: |
          echo "========================================="
          echo "     ZESA BILLING REDIS DEPLOYMENT       "
          echo "========================================="
          echo "Service: Redis Cache"
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "Release: ${{ env.RELEASE_NAME }}"
          echo "Build ID: ${{ github.run_id }}-${{ github.run_number }}"
          echo "========================================="

      - name: Setup SSH and Copy Helm Files to Remote
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_WORKSPACE: ${{ secrets.REMOTE_DEPLOY_DIR }}/redis-${{ github.run_id }}
        run: |
          echo "Setting up SSH..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if ! grep -q "$REMOTE_SERVER" ~/.ssh/known_hosts 2>/dev/null; then
            if ! ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>&1; then
              echo "❌ ERROR: Failed to scan host key for $REMOTE_SERVER"
              exit 1
            fi
          fi

          if ! grep -q "$REMOTE_SERVER" ~/.ssh/known_hosts; then
            echo "❌ ERROR: Host key not found in known_hosts"
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts
          echo "✓ SSH host verification configured"

          if [ -z "$REMOTE_WORKSPACE" ] || [ "$REMOTE_WORKSPACE" = "/" ]; then
            echo "❌ ERROR: Invalid REMOTE_WORKSPACE: '$REMOTE_WORKSPACE'"
            exit 1
          fi

          echo "Cleaning remote workspace..."
          ssh -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" "rm -rf $REMOTE_WORKSPACE"
          ssh -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" "mkdir -p $REMOTE_WORKSPACE/.helm"

          echo "Copying Redis Helm files to remote server..."
          scp -o StrictHostKeyChecking=yes -r .helm/redis "$REMOTE_USER@$REMOTE_SERVER:$REMOTE_WORKSPACE/.helm/"
          echo "✓ Files copied successfully"

      - name: Deploy on Remote Server
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_WORKSPACE: ${{ secrets.REMOTE_DEPLOY_DIR }}/redis-${{ github.run_id }}
          RESTART_REASON: "github-actions-deploy"
        run: |
          echo "Setting up SSH..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if ! grep -q "$REMOTE_SERVER" ~/.ssh/known_hosts 2>/dev/null; then
            ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          ssh -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER"               RESTART_REASON="$RESTART_REASON"               REMOTE_WORKSPACE="$REMOTE_WORKSPACE"               NAMESPACE="${{ env.NAMESPACE }}"               DEPLOYMENT_NAME="${{ env.DEPLOYMENT_NAME }}"               RELEASE_NAME="${{ env.RELEASE_NAME }}"           bash << 'ENDSSH'
          set -e

          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          cd "$REMOTE_WORKSPACE"

          if ! kubectl cluster-info > /dev/null 2>&1; then
            echo "❌ Error: k3s is not running or KUBECONFIG is not set correctly"
            exit 1
          fi
          echo "✓ k3s cluster is accessible"

          if ! kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
            echo "Creating namespace $NAMESPACE..."
            kubectl create namespace "$NAMESPACE"
            echo "✓ Namespace created"
          else
            echo "✓ Namespace already exists"
          fi

          TIMESTAMP=$(date +%s)

          echo "Deploying Redis with Helm..."
          helm upgrade --install $RELEASE_NAME .helm/redis             --namespace "$NAMESPACE"             --set namespace="$NAMESPACE"             --set restartTimestamp="$TIMESTAMP"             --set restartReason="$RESTART_REASON"             --timeout=600s

          echo "✓ Helm deployment initiated"

          echo ""
          echo "Waiting for deployment to be ready..."
          if ! kubectl wait --for=condition=available --timeout=300s               deployment/$DEPLOYMENT_NAME -n $NAMESPACE; then
            echo "❌ Deployment failed to become ready"
            kubectl get pods -n $NAMESPACE -l app=$DEPLOYMENT_NAME
            echo ""
            kubectl logs -n $NAMESPACE -l app=$DEPLOYMENT_NAME --tail=50
            echo ""
            echo "Rolling back to previous version..."
            helm rollback $RELEASE_NAME -n $NAMESPACE
            echo "❌ Redis deployment failed and has been rolled back"
            exit 1
          fi

          echo "✓ Deployment is healthy and ready"

          echo ""
          echo "Checking pod status..."
          kubectl get pods -n $NAMESPACE -l app=$DEPLOYMENT_NAME
          ENDSSH

      - name: Cleanup Remote Workspace
        if: always()
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_WORKSPACE: ${{ secrets.REMOTE_DEPLOY_DIR }}/redis-${{ github.run_id }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if ! grep -q "$REMOTE_SERVER" ~/.ssh/known_hosts 2>/dev/null; then
            ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          if [ -z "$REMOTE_WORKSPACE" ] || [ "$REMOTE_WORKSPACE" = "/" ]; then
            echo "❌ ERROR: Invalid REMOTE_WORKSPACE: '$REMOTE_WORKSPACE'"
            exit 1
          fi

          echo "Cleaning remote workspace..."
          ssh -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" "rm -rf $REMOTE_WORKSPACE"
          echo "✓ Remote workspace cleaned"

      - name: Deployment Summary
        if: always()
        run: |
          echo "========================================="
          echo "  REDIS DEPLOYMENT SUMMARY"
          echo "========================================="
          echo "✓ Redis deployment triggered"
          echo ""
          echo "Note: Redis password secret must be deployed via the k3s-secrets workflow"
