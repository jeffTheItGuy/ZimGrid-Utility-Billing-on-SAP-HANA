name: K3s Secrets Cleanup

on:
  workflow_dispatch:

env:
  NAMESPACE: zesademo

jobs:
  cleanup-secrets:
    runs-on: self-hosted
    name: Cleanup K3s Secrets
    steps:
      - name: Remove Secrets from Remote K3s Cluster
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if ! grep -q "$REMOTE_SERVER" ~/.ssh/known_hosts 2>/dev/null; then
            ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          ssh -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER"               NAMESPACE="${{ env.NAMESPACE }}"           bash << 'ENDSSH'
          set -e
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          echo "Removing secrets from namespace $NAMESPACE..."

          kubectl delete secret database-secrets -n "$NAMESPACE" 2>/dev/null && echo "✓ database-secrets deleted" || echo "⚠️  database-secrets not found"
          kubectl delete secret redis-secrets -n "$NAMESPACE" 2>/dev/null && echo "✓ redis-secrets deleted" || echo "⚠️  redis-secrets not found"
          kubectl delete secret hana-secrets -n "$NAMESPACE" 2>/dev/null && echo "✓ hana-secrets deleted" || echo "⚠️  hana-secrets not found"

          echo ""
          echo "✓ Secrets cleanup completed"
          ENDSSH

      - name: Cleanup Summary
        if: always()
        run: |
          echo "========================================="
          echo "  SECRETS CLEANUP SUMMARY"
          echo "========================================="
          echo "✓ Secret removal executed"
          echo ""
          echo "WARNING: Applications using these secrets will fail until they are redeployed."
          echo "========================================="
