version: "3.9"

services:
  # === Development Database (PostgreSQL with HANA-compatible schema) ===
  postgres-dev:
    image: postgres:16-alpine
    container_name: zimgrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zimgrid_billing
      POSTGRES_USER: zimgrid_admin
      POSTGRES_PASSWORD: zimgrid_dev_pass
      PGADMIN_DEFAULT_EMAIL: admin@zimgrid.com
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - zimgrid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zimgrid_admin -d zimgrid_billing"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === SAP HANA 2.0 Express Edition (Optional) ===
  # Uncomment if you have a HANA Express image or SAP registry access.
  # This demonstrates MDC (Multi-Database Container) topology knowledge.
  # hana:
  #   image: saplabs/hanaexpress:2.00.061.00.20220519.1
  #   container_name: zimgrid-hana
  #   restart: unless-stopped
  #   hostname: hana-primary
  #   volumes:
  #     - hana_data:/hana/mounts
  #   ports:
  #     - "39013:39013"  # System DB SQL port
  #     - "39015:39015"  # Tenant DB (HDB) SQL port
  #     - "39041:39041"  # XS Advanced
  #   networks:
  #     - zimgrid-network
  #   environment:
  #     AGREE_TO_SAP_LICENSE: "true"
  #     MASTER_PASSWORD: "HanaExpress123!"

  # === Redis (Token idempotency, session cache, rate limiting) ===
  redis:
    image: redis:7-alpine
    container_name: zimgrid-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - zimgrid-network
    command: redis-server --appendonly yes

  # === Backend API ===
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zimgrid-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: postgres-dev
      DB_PORT: 5432
      DB_NAME: zimgrid_billing
      DB_USER: zimgrid_admin
      DB_PASSWORD: zimgrid_dev_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-jwt-secret-change-in-prod
      # USE_HANA: "true"
      # HANA_HOST: hana
      # HANA_PORT: 39015
      # HANA_USER: SYSTEM
      # HANA_PASSWORD: HanaExpress123!
      # HANA_TENANT_DB: HDB
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    ports:
      - "4000:4000"
    networks:
      - zimgrid-network
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run dev

  # === Frontend (React + Vite) ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zimgrid-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api/v1
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - zimgrid-network
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  postgres_data:
  redis_data:
  hana_data:

networks:
  zimgrid-network:
    driver: bridge
