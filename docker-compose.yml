version: "3.9"

services:
  # === Development Database (PostgreSQL with HANA-compatible schema) ===
  postgres-dev:
    image: postgres:16-alpine
    container_name: zimgrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zimgrid_billing
      POSTGRES_USER: zimgrid_admin
      POSTGRES_PASSWORD: zimgrid_dev_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - zimgrid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zimgrid_admin -d zimgrid_billing"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Redis (Token idempotency, session cache, rate limiting) ===
  redis:
    image: redis:7-alpine
    container_name: zimgrid-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - zimgrid-network
    command: redis-server --appendonly yes

  # === Backend API ===
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zimgrid-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: postgres-dev
      DB_PORT: 5432
      DB_NAME: zimgrid_billing
      DB_USER: zimgrid_admin
      DB_PASSWORD: zimgrid_dev_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-jwt-secret-change-in-prod
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    ports:
      - "4000:4000"
    networks:
      - zimgrid-network
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run dev

  # === Frontend (React + Vite) ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zimgrid-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api/v1
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - zimgrid-network
    depends_on:
      - backend
    command: npm run dev -- --host


volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  zimgrid-network:
    driver: bridge
